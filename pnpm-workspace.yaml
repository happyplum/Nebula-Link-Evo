  - 'pretty-ms@9.3.1'
  - 'react-router-dom@7.18.3'
  - 'react-router@7.18.3'
  - 'zod@4.5.2'

overrides:
  use-sync-external-store: 1.6.0

patchedDependencies:
  '@deepseek-ai/dsh-session-persistence-jsonl@0.1.1-rc.2': patches/@deepseek-ai__dsh-session-persistence-jsonl@0.1.1-rc.2.patch
