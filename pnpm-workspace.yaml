  - proxy-adapter
  - ai-chat-service
  - ai-e2e
  - ai-e2e/ui
  - integrations/*

catalog:
  '@fastify/autoload': ^5.10.0
  '@fastify/cors': ^11.3.0
  '@fastify/type-provider-typebox': ^5.2.0
  '@fastify/websocket': ^11.1.0
  '@livekit/rtc-node': ^0.13.34
  '@sinclair/typebox': ^0.32.37
  '@typescript/native': npm:typescript@^7.0.2
  '@types/node': ^22.20.1
  '@types/ws': ^8.18.1
  '@vitest/coverage-v8': ^4.1.11
  axios: ^1.20.0
  dotenv: ^17.4.2
  esbuild: ^0.27.3
  fastify: ^5.12.1
  fastify-plugin: ^4.5.1
  js-yaml: ^4.1.1
  livekit-client: ^2.22.1
  livekit-server-sdk: ^2.18.0
  sharp: ^0.35.4
  terser: ^5.0.0
  tsx: ^4.23.12
