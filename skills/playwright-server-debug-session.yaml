id: playwright-server-debug-session
name: Playwright Server Debug Session
description: Parameterized web debug session using Nebula-Link Evo playwright-server endpoints
version: 1.0.0
category: debug
enabled: true
steps:
  - type: navigate
    params:
      url: '{{targetUrl}}'
    reasoning: Open target page for debugging
  - type: wait
    params:
      delay: 2000
    reasoning: Wait for dynamic content to stabilize
  - type: scroll
    params:
      x: 0
      y: 600
    reasoning: Trigger lazy-loaded sections when needed
  - type: wait
    params:
      delay: 1200
    reasoning: Wait after scroll for DOM updates
  - type: finish
    params:
      result: Debug session flow completed. Collect screenshot/DOM/status via playwright-server endpoints for evidence.
    reasoning: End debug flow and return summary
