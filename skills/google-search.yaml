id: google-search
name: Google Search
description: Navigate to Google and perform a search query
version: 1.0.0
steps:
  - action: navigate
    params:
      url: https://www.google.com
      waitUntil: networkidle
    description: Navigate to Google homepage
  - action: wait
    params:
      duration: 1000
    description: Wait for page to load
  - action: type
    params:
      selector: "[name='q'], textarea[name='q']"
      text: "{{query}}"
      options:
        clear: true
    description: Type search query in the search box
  - action: wait
    params:
      duration: 500
    description: Wait for input to register
