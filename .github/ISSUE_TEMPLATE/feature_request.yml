name: Feature request
description: 提议一个有明确使用场景的功能
title: '[Feature]: '
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 描述当前无法完成的任务，而不是只描述期望实现。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明可验证的行为、边界和验收标准。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 说明现有功能为何不足，以及是否存在更小的改动方案。
  - type: dropdown
    id: package
    attributes:
      label: 主要影响范围
      options:
        - proxy-adapter
        - ai-chat-service
        - debug-ui
        - ai-e2e
        - shared
        - repository/tooling
        - 不确定
    validations:
      required: true
