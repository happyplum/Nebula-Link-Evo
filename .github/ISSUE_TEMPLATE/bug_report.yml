name: Bug report
description: 报告可复现的缺陷
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。安全漏洞请按 SECURITY.md 私密报告，不要填写此表单。
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 说明实际行为、预期行为和影响。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 提供最小、稳定、无敏感信息的复现步骤。
      placeholder: |
        1. 启动……
        2. 打开……
        3. 执行……
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: 版本或提交
      description: 受影响的 tag、分支或 commit SHA。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 操作系统、Node.js、pnpm、浏览器及相关服务版本。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 日志与证据
      description: 删除凭据、Cookie、用户数据和内部地址后再粘贴。
      render: shell
