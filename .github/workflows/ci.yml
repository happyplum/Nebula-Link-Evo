name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check dependency graph deduplication
        run: pnpm dedupe --check

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Verify Harness dependency BOM
        run: pnpm --filter ai-chat-service verify:harness-bom

      - name: Install Playwright Chromium
        run: pnpm --filter proxy-adapter exec playwright install --with-deps chromium

      - name: Check repository metadata formatting
        run: >-
          pnpm exec prettier --check
          "COMMERCIAL-LICENSE.md"
          "CONTRIBUTING.md"
          "SECURITY.md"
          "CODE_OF_CONDUCT.md"
          ".github/**/*.md"
          ".github/**/*.yml"

      - name: Build
        run: pnpm build

      - name: Type-check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint && pnpm --filter ai-e2e lint

      - name: Check source formatting
        run: pnpm format:check

      - name: Test
        run: pnpm -r --workspace-concurrency=1 test

      - name: Coverage
        run: pnpm test:coverage

      - name: Cross-service E2E
        run: xvfb-run -a pnpm test:e2e
